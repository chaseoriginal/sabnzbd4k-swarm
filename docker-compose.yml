---
services:
  sabnzbd:
    image: ${image}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /var/lib/docker/volumes/${container_name}/config:/config
      - /media/Multimedia/Incoming/:/downloads
      - /media/Multimedia/Incoming/incomplete/:/incomplete-downloads
    ports:
      - target: 8080
        published: 8085
        protocol: tcp
        mode: host        
    deploy:
      placement:
        constraints:
          - node.labels.deployment.target.sabnzbd4k == true
      restart_policy:
        condition: any