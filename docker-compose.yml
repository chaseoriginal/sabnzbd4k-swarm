services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    environment:
    - PUID=1000
    - PGID=33
    - TZ=America/Chicago
    volumes:
    - /var/lib/docker/volumes/sabnzbd4k-swarm/config:/config
    - /media/Multimedia/Incoming/:/downloads
    - /media/Multimedia/Incoming/incomplete/:/incomplete-downloads
    ports:
    - target: 8080
      published: 8085
      protocol: tcp
      mode: host
    deploy:
      placement:
        constraints:
        - node.labels.deployment.target.sabnzbd4k == true
      restart_policy:
        condition: any
volumes: {}
